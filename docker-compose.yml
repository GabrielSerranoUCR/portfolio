services:
  portfolio:
    build: .
    restart: unless-stopped
    env_file: .env
    expose:
      - "3000"

  # Reverse proxy with automatic HTTPS. Add your other projects to the Caddyfile.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - portfolio

volumes:
  caddy_data:
  caddy_config:
